services:
    gateway:
        build:
            context: .
            dockerfile: services/gateway/Dockerfile
        environment:
            - GATEWAY_HOST=0.0.0.0
            - GATEWAY_PORT=3000
            - FIBONACCI_HOST=fibonacci
            - FIBONACCI_PORT=3001
            - SCORING_HOST=scoring
            - SCORING_PORT=4002
        ports:
            - 3000:3000
    fibonacci:
        build:
            context: .
            dockerfile: services/fibonacci/Dockerfile
        environment:
            - FIBONACCI_HOST=0.0.0.0
            - FIBONACCI_PORT=3001
        ports:
            - 3001:3001
    scoring:
        build:
            context: .
            dockerfile: services/scoring/Dockerfile
        environment:
            - SCORING_HOST=0.0.0.0
            - SCORING_PORT=4002
        ports:
            - 4002:4002
    auth:
        build:
            context: .
            dockerfile: services/auth/Dockerfile
        environment:
            - AUTH_HOST=0.0.0.0
            - AUTH_PORT=3002
            - AUTH_DB_HOST=auth-db
            - AUTH_DB_PORT=5432
            - AUTH_DB_USER=auth
            - AUTH_DB_PASSWORD=auth
            - AUTH_DB_NAME=auth
        depends_on:
            auth-db:
                condition: service_healthy
        ports:
            - 3002:3002
    auth-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=auth
            - POSTGRES_PASSWORD=auth
            - POSTGRES_DB=auth
        volumes:
            - auth-db-data:/var/lib/postgresql/data
        ports:
            - 127.0.0.1:5432:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
            interval: 5s
            timeout: 3s
            retries: 5
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        ports:
            - 127.0.0.1:6379:6379
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    redis-data:
    auth-db-data:
