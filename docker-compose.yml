services:
    gateway:
        build:
            context: .
            dockerfile: services/gateway/Dockerfile
        environment:
            - GATEWAY_HOST=0.0.0.0
            - GATEWAY_PORT=3000
            - SCORING_HOST=scoring
            - SCORING_PORT=4002
            - AUTH_GRPC_HOST=auth
            - AUTH_GRPC_PORT=50051
            - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
        ports:
            - 3000:3000
    scoring:
        build:
            context: .
            dockerfile: services/scoring/Dockerfile
        environment:
            - SCORING_HOST=0.0.0.0
            - SCORING_PORT=4002
        ports:
            - 4002:4002
    auth:
        build:
            context: .
            dockerfile: services/auth/Dockerfile
        environment:
            - AUTH_GRPC_HOST=0.0.0.0
            - AUTH_GRPC_PORT=50051
            - AUTH_DB_HOST=auth-db
            - AUTH_DB_PORT=5432
            - AUTH_DB_USER=auth
            - AUTH_DB_PASSWORD=auth
            - AUTH_DB_NAME=auth
            - JWT_SECRET=${JWT_SECRET:-dev-only-change-me}
            - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-3600}
        depends_on:
            auth-db:
                condition: service_healthy
        ports:
            - 50051:50051
    auth-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=auth
            - POSTGRES_PASSWORD=auth
            - POSTGRES_DB=auth
        volumes:
            - auth-db-data:/var/lib/postgresql/data
        ports:
            - 127.0.0.1:5432:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
            interval: 5s
            timeout: 3s
            retries: 5
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        ports:
            - 127.0.0.1:6379:6379
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    redis-data:
    auth-db-data:
