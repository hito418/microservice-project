services:
    gateway:
        build:
            context: .
            dockerfile: services/gateway/Dockerfile
        environment:
            - GATEWAY_HOST=0.0.0.0
            - GATEWAY_PORT=3000
            - SCORING_GRPC_HOST=scoring
            - SCORING_GRPC_PORT=50052
            - AUTH_GRPC_HOST=auth
            - AUTH_GRPC_PORT=50051
            - PROFILE_GRPC_HOST=profile
            - PROFILE_GRPC_PORT=50053
            - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
            - JWT_PUBLIC_KEY_PATH=/app/.secrets/public.pem
            - JWT_ALGORITHM=${JWT_ALGORITHM:-ES256}
            - LOG_LEVEL=verbose
        volumes:
            - ./.secrets/jwt/public.pem:/app/.secrets/public.pem:ro
        ports:
            - 3000:3000
        networks:
            - gateway
    scoring:
        build:
            context: .
            dockerfile: services/scoring/Dockerfile
        environment:
            - SCORING_GRPC_HOST=0.0.0.0
            - SCORING_GRPC_PORT=50052
            - SCORING_DB_HOST=scoring-db
            - SCORING_DB_PORT=5432
            - SCORING_DB_USER=scoring
            - SCORING_DB_PASSWORD=scoring
            - SCORING_DB_NAME=scoring
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        networks:
            - scoring-service
            - gateway
            - queue
        depends_on:
            scoring-db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            # Bind to localhost only: scoring trusts gateway-supplied identity
            # metadata (x-user-id/x-user-role), so the gRPC port must not be
            # reachable by arbitrary clients that could bypass the gateway and
            # spoof a principal. Host loopback stays open for local debugging;
            # in-cluster traffic uses scoring:50052 over the gateway network.
            - 127.0.0.1:50052:50052
    scoring-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=scoring
            - POSTGRES_PASSWORD=scoring
            - POSTGRES_DB=scoring
        volumes:
            - scoring-db-data:/var/lib/postgresql/data
        ports:
            # Host 5434 → container 5432: avoids clashing with the auth-db (5433)
            # and other local Postgres instances. In-cluster traffic still uses
            # scoring-db:5432 over the scoring-service network.
            - 5434:5432
        networks:
            - scoring-service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U scoring -d scoring"]
            interval: 5s
            timeout: 3s
            retries: 5
    auth:
        build:
            context: .
            dockerfile: services/auth/Dockerfile
        environment:
            - AUTH_GRPC_HOST=0.0.0.0
            - AUTH_GRPC_PORT=50051
            - AUTH_DB_HOST=auth-db
            - AUTH_DB_PORT=5432
            - AUTH_DB_USER=auth
            - AUTH_DB_PASSWORD=auth
            - AUTH_DB_NAME=auth
            - JWT_PRIVATE_KEY_PATH=/app/.secrets/private.pem
            - JWT_ALGORITHM=${JWT_ALGORITHM:-ES256}
            - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-3600}
        volumes:
            - ./.secrets/jwt/private.pem:/app/.secrets/private.pem:ro
        networks:
            - auth-service
            - gateway
        depends_on:
            auth-db:
                condition: service_healthy
        ports:
            - 50051:50051
    auth-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=auth
            - POSTGRES_PASSWORD=auth
            - POSTGRES_DB=auth
        volumes:
            - auth-db-data:/var/lib/postgresql/data
        ports:
            # Host 5433 → container 5432: avoids clashing with other local
            # Postgres instances on the default 5432. In-cluster traffic still
            # uses auth-db:5432 over the auth-service network.
            - 5433:5432
        networks:
            - auth-service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
            interval: 5s
            timeout: 3s
            retries: 5
    profile:
        build:
            context: .
            dockerfile: services/profile/Dockerfile
        environment:
            - PROFILE_GRPC_HOST=0.0.0.0
            - PROFILE_GRPC_PORT=50053
            - PROFILE_DB_HOST=profile-db
            - PROFILE_DB_PORT=5432
            - PROFILE_DB_USER=profile
            - PROFILE_DB_PASSWORD=profile
            - PROFILE_DB_NAME=profile
        networks:
            - profile-service
            - gateway
        depends_on:
            profile-db:
                condition: service_healthy
        ports:
            # Bind to localhost only: profile trusts gateway-supplied identity
            # metadata (x-user-id/x-user-role), so the gRPC port must not be
            # reachable by arbitrary clients that could bypass the gateway and
            # spoof a principal. Host loopback stays open for local debugging;
            # in-cluster traffic uses profile:50053 over the gateway network.
            - 127.0.0.1:50053:50053
    profile-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=profile
            - POSTGRES_PASSWORD=profile
            - POSTGRES_DB=profile
        volumes:
            - profile-db-data:/var/lib/postgresql/data
        ports:
            # Host 5435 → container 5432: avoids clashing with auth-db (5433) and
            # scoring-db (5434). In-cluster traffic still uses profile-db:5432
            # over the profile-service network.
            - 5435:5432
        networks:
            - profile-service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U profile -d profile"]
            interval: 5s
            timeout: 3s
            retries: 5
    debate:
        build:
            context: .
            dockerfile: services/debate/Dockerfile
        environment:
            - DEBATE_GRPC_HOST=0.0.0.0
            - DEBATE_GRPC_PORT=50055
            - DEBATE_DB_HOST=debate-db
            - DEBATE_DB_PORT=5432
            - DEBATE_DB_USER=debate
            - DEBATE_DB_PASSWORD=debate
            - DEBATE_DB_NAME=debate
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        networks:
            - debate-service
            - gateway
        depends_on:
            debate-db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - 127.0.0.1:50055:50055
    debate-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=debate
            - POSTGRES_PASSWORD=debate
            - POSTGRES_DB=debate
        volumes:
            - debate-db-data:/var/lib/postgresql/data
        ports:
            # Host 5436 → container 5432: avoids clashing with auth-db (5433),
            # scoring-db (5434) and profile-db (5435).
            - 5436:5432
        networks:
            - debate-service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U debate -d debate"]
            interval: 5s
            timeout: 3s
            retries: 5
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        ports:
            - 6379:6379
        networks:
            - queue
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
    finalization:
        build:
            context: .
            dockerfile: runners/finalization/Dockerfile
        environment:
            # No inbound listener — the runner consumes the debate.finalize queue
            # from Redis and calls scoring over gRPC to compute final scores.
            - SCORING_GRPC_HOST=scoring
            - SCORING_GRPC_PORT=50052
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - WORKER_CONCURRENCY=${FINALIZATION_CONCURRENCY:-1}
            - LOG_LEVEL=verbose
        networks:
            # gateway → reach scoring:50052; queue → reach redis:6379
            - gateway
            - queue
        depends_on:
            redis:
                condition: service_healthy
            scoring:
                condition: service_started

volumes:
    redis-data:
    auth-db-data:
    scoring-db-data:
    profile-db-data:
    debate-db-data:

networks:
    auth-service:
    scoring-service:
    profile-service:
    debate-service:
    gateway:
    queue:
