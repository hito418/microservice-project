syntax = "proto3";

package auth.v1;

service AuthService {
    rpc Signup (SignupRequest) returns (SignupResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
}

message SignupRequest {
    string email = 1;
    string password = 2;
}

message SignupResponse {
    string id = 1;
    string email = 2;
    // RFC 3339 / ISO 8601
    string created_at = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string jwt = 1;
    string user_id = 2;
    string role = 3;
    // Lifetime of the access_token in seconds.
    int32 expires_in = 4;
}
