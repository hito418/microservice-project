packages:
    - services/*
    - packages/*
    - runners/*
    - toolings/*
    - contracts/*

catalog:
    typescript: ^5.8.2
    oxlint: ^1.1.0
    oxfmt: ^0.47.0

    # nest
    "@nestjs/common": ^11.0.0
    "@nestjs/core": ^11.0.0
    "@nestjs/microservices": ^11.0.0
    "@nestjs/platform-fastify": ^11.0.0
    "@nestjs/cli": 11.0.21
    "@nestjs/jwt": ^11.0.0
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.1

    # grpc
    "@grpc/grpc-js": ^1.12.0
    "@grpc/proto-loader": ^0.7.13
    grpc-tools: ^1.12.4
    ts-proto: ^2.2.0

    # auth / persistence
    bcryptjs: ^2.4.3
    drizzle-kit: ^0.28.0
    drizzle-orm: ^0.36.0
    kysely: ^0.27.0
    pg: ^8.13.0
    zod: ^3.23.8

    # testing
    vitest: ^2.1.0
